server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  location ~ ^/api/v1/(analytics|admin|operator|expert|staff)(/|$) { return 403; }
  location /api/ { proxy_pass http://api:8080; proxy_set_header X-Demo-Role ""; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
  location ~ ^/(staff|admin|analytics)(/|$) { return 404; }
  location / { try_files $uri /index.html; }
}
